version: "3.5"
services:
  ship:
    build:
      context: .
      dockerfile: build/Dockerfile
    image: "ship.uvm.public.dappnode.eth:0.1.3"
    restart: unless-stopped
    environment:
      IMPORTER_BOOTSTRAP_SHA256: ""
      OWNER_CA_SHA256: ""
      IMPORTER_ORIGIN: "https://uvm.public.dappnode.private:8443"
      URBIT_SHIP_ORIGIN: "https://ship.uvm.public.dappnode.private:8443"
    volumes:
      # Same key, new package namespace: never auto-adopt the old package's volume.
      - "ship_data:/urbit"
    expose:
      - "8443/tcp"
      - "34343/udp"
    command:
      - --pier-root
      - /urbit/pier
      - --uploads-root
      - /urbit/uploads
      - --control-root
      - /urbit/control
      - --password-hash-file
      - /urbit/control/auth.json
      - --bind
      - 0.0.0.0
    stop_signal: SIGTERM
    stop_grace_period: 3m
    logging:
      driver: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  ship_data: {}
