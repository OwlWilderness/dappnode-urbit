version: "2"
fields:
  - id: bootstrapDigest
    title: Importer enrollment authority digest
    description: >-
      Generate the owner authority on your own computer using the offline
      bootstrap-authority.html page. Paste only its 64-character lowercase
      SHA-256 digest here, not the authority itself, a ship key, or a password.
      Keep the authority in your own password manager for one-time enrollment
      after the private HTTPS route is verified. This field does not configure
      TLS or grant permission to start a ship.
    target:
      type: environment
      name: IMPORTER_BOOTSTRAP_SHA256
      service: ship
    secret: true
    required: true
    pattern: "^[a-f0-9]{64}$"
    patternErrorMessage: Enter exactly 64 lowercase hexadecimal characters from the offline digest field.
  - id: ownerCaFingerprint
    title: Owner CA public certificate fingerprint
    description: >-
      Enter the lowercase SHA-256 fingerprint of your root CA's DER certificate,
      without colons. Obtain this independently on your own computer, not from
      an uploaded server certificate. Never enter a CA private key. The package
      creates only a server key and public CSR, then waits for your signed certificate.
    target:
      type: environment
      name: OWNER_CA_SHA256
      service: ship
    secret: false
    required: true
    pattern: '^[a-f0-9]{64}$'
    patternErrorMessage: Enter exactly 64 lowercase hexadecimal characters, without colons.
  - id: importerOrigin
    title: Private importer HTTPS origin
    description: >-
      Use https://uvm.public.dappnode.private:8443 for this package's private
      administration route after its DNS has been verified. Use port 8443 and
      omit any trailing slash, path, query or fragment. This does not install
      browser trust. Owner enrollment and personal import require verified
      private HTTPS; ship Start remains a separate authenticated action.
    target:
      type: environment
      name: IMPORTER_ORIGIN
      service: ship
    secret: false
    required: true
    pattern: '^https://[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*(?::[0-9]{1,5})?$'
    patternErrorMessage: Enter the exact private HTTPS origin, without credentials, a trailing slash or a path.
  - id: shipOrigin
    title: Private ship HTTPS origin
    description: >-
      Use https://ship.uvm.public.dappnode.private:8443 for the ship web UI.
      Its hostname must differ from the administration hostname and both must
      appear in your signed server certificate. Do not expose a plaintext ship
      port. This field does not start a ship or provision a certificate.
    target:
      type: environment
      name: URBIT_SHIP_ORIGIN
      service: ship
    secret: false
    required: true
    pattern: '^https://[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*(?::[0-9]{1,5})?$'
    patternErrorMessage: Enter the exact separate ship HTTPS origin on port 8443.
